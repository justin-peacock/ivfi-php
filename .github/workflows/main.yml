name: Build

on:
  push:
    # master is kept so the workflow still fires if these changes are
    # offered upstream, where that is the default branch
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [ '20', '22', '24' ]

    name: Build (Node ${{ matrix.node }})

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build

    - name: Build standalone
      run: npm run make-standalone

    - name: Archive production artifacts
      if: matrix.node == '22'
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: build/

  php:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.3', '8.4' ]

    name: PHP ${{ matrix.php }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        coverage: none
        tools: composer

    # The authentication tests drive a real digest exchange, which needs the
    # response headers that only a CGI SAPI emits
    - name: Install php-cgi
      run: |
        # setup-php adds the ondrej PPA, but the package lists are still the
        # image's, so the newest versions are not yet visible to apt
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends php${{ matrix.php }}-cgi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    # The suite runs against the built indexer.php, not the webpack template
    - name: Build the indexer
      run: |
        npm ci
        npm run build

    - name: Install PHP dependencies
      run: composer install --no-interaction --no-progress

    - name: Run the PHP test suite
      run: vendor/bin/phpunit
      env:
        # Turn a missing php-cgi into a failure rather than a silent skip
        IVFI_REQUIRE_CGI: '1'
