server {
    listen 80 default_server;

    # Location of indexer files
    root /var/www/html;

    # Redirects stay relative, so a directory's trailing-slash redirect keeps
    # the https scheme the proxy in front terminated
    absolute_redirect off;

    # client_max_body_size, written at start from IVFI_MAX_UPLOAD_SIZE
    include /etc/nginx/ivfi-limits.conf;
    client_body_timeout 600s;

    add_header X-Content-Type-Options nosniff always;

    # Liveness of php-fpm, for the container healthcheck only
    location = /fpm-ping {
        allow 127.0.0.1;
        deny all;
        access_log off;

        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Dotfiles: per-directory `.ivfi` settings and in-flight upload staging
    location ~ /\. {
        deny all;
    }

    location / {
        # Check if $uri exists as a file on the served directory
        if (-f /data$uri) {
            root /data;
        }

        # Check if $uri exists as a directory on the served directory
        if (-d /data$uri) {
            root /data;

            rewrite ^([^.]*[^/])$ $1/ permanent;
        }

        index /indexer.php;
    }

    # PHP only ever runs from the indexer's own files, never from /data
    location ~ ^/.+\.php(/|$) {
        root /var/www/html;
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 600s;

        include fastcgi_params;

        fastcgi_param INDEXER_BASE_PATH /data;
        fastcgi_param SCRIPT_FILENAME   $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO         $fastcgi_path_info;
    }

    # Pages and other active content from the served directory run sandboxed.
    #
    # Opened here, an HTML page or SVG would otherwise run as this origin, next
    # to the signed-in session, and act as whoever opened it. `sandbox` without
    # `allow-same-origin` gives it an opaque origin instead: its own scripts,
    # styles, forms and popups still work, but it cannot use this origin's
    # session, and it has no storage or same-origin `fetch()` of its own.
    #
    # After the PHP location, so `/indexer.php/x.html` still reaches PHP. An
    # image embedded with `<img>` ignores the header, so previews are unaffected
    location ~* \.(?:html?|xht(?:ml)?|svgz?|xml|xslt?|mht(?:ml)?)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads" always;

        if (-f /data$uri) {
            root /data;
        }

        # A directory that happens to end in `.html` still gets its listing
        if (-d /data$uri) {
            return 301 $uri/;
        }
    }
}
